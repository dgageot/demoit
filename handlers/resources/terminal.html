<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1b26; }
        #terminal { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <script type="module">
        // Use ghostty-web terminal emulator.
        // PR #136 (https://github.com/coder/ghostty-web/pull/136) fixes wheel
        // events with mouse tracking for proper tmux/vim pane scrolling.
        const { init, Terminal, FitAddon } = await import(
            'https://cdn.jsdelivr.net/npm/ghostty-web@0.4.0/dist/ghostty-web.js'
        );

        await init();

        const frame = window.frameElement;
        if (frame) {
            frame.style.fontSize = 'var(--source-code-font-size, 16px)';
        }

        const container = document.getElementById('terminal');
        const term = new Terminal({
            fontSize: terminalFontSize(),
            fontFamily: 'monospace',
            cursorBlink: true,
            scrollback: 10000,
            theme: {
                background: '#1a1b26',
                foreground: '#a9b1d6',
            },
        });

        term.open(container);
        term.attachCustomWheelEventHandler((event) => {
            if (!event.ctrlKey && !event.metaKey &&
                (!document.hasFocus() || !container.contains(document.activeElement))) {
                window.focus();
                term.focus();
            }
            return false;
        });

        // FitAddon recalculates terminal cols/rows from the container's
        // pixel dimensions and calls term.resize(), which fires onResize.
        const fitAddon = new FitAddon();
        term.loadAddon(fitAddon);
        fitAddon.fit();

        // Connect to the WebSocket PTY backend.
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(proto + '//' + location.host + '/ws/terminal' + location.search);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            // Forward user input to the server.
            term.onData((data) => {
                ws.send(data);
            });

            // Send initial resize.
            sendResize();

            // Handle terminal resize: when FitAddon recalculates dimensions
            // on container size changes, this forwards the new size to the PTY.
            term.onResize(sendResize);
        };

        ws.onmessage = (e) => {
            if (e.data instanceof ArrayBuffer) {
                term.write(new Uint8Array(e.data));
            } else {
                term.write(e.data);
            }
        };

        ws.onclose = () => {
            term.write('\r\n\x1b[90m[Session ended]\x1b[0m\r\n');
        };

        function terminalFontSize() {
            // CSS lengths are resolved in the presentation, not the iframe viewport.
            const size = frame ? parseFloat(window.parent.getComputedStyle(frame).fontSize) : 16;
            return Number.isFinite(size) && size > 0 ? size : 16;
        }

        function sendResize() {
            ws.send(JSON.stringify({
                type: 'resize',
                cols: term.cols || 80,
                rows: term.rows || 24,
            }));
        }

        // Automatically refit terminal when the container resizes (e.g.
        // when the fake-window zoom button is clicked). FitAddon.fit()
        // recalculates cols/rows from the new container size, calls
        // term.resize(), which fires onResize → sendResize → PTY resize.
        new ResizeObserver(() => {
            const fontSize = terminalFontSize();
            if (term.options.fontSize !== fontSize) {
                term.options.fontSize = fontSize;
            }
            fitAddon.fit();
        }).observe(container);

        // Re-focus the terminal when the iframe's window regains focus
        // (e.g. after clicking the zoom button in the parent frame).
        window.addEventListener('focus', () => term.focus());
        if (new URLSearchParams(location.search).has('autofocus')) {
            window.focus();
            term.focus();
        }
    </script>
</body>
</html>
